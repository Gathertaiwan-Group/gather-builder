name: Deploy to Vercel

# push 到 main → 型別檢查＋測試 → 部署正式站。
# Vercel Hobby 會擋「commit 作者不是 team 成員」的部署（TEAM_ACCESS_REQUIRED），
# 所以部署前先移除 .git，讓 CLI 不附帶 git 中繼資料（與 README「部署」段的手動做法相同）。
# DB migration 不在這裡跑：有 DB 變更時先手動 `npm run migrate`，再 push。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # 2026-10-19 曾有循環 import（TDZ）只在 next build／執行時才爆，typecheck＋test 抓不到 → CI 也要 build。
      # 用假值讓 build 不需連線真實服務。
      - name: Build check
        run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
          ADMIN_PASSWORD: ci-dummy-password
          ADMIN_SESSION_SECRET: ci-dummy-session-secret-0123456789
          PREVIEW_SECRET: ci-dummy-preview-secret-0123456789
          PAYMENT_ENC_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

      - name: Deploy (without git metadata)
        run: |
          rm -rf .git .next
          npx --yes vercel@54.4.1 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"

      # 部署後探針：平台首頁與示範租戶頁必須 200，否則 workflow 失敗（GitHub 會寄信）。
      # 第九批：啟用子網域（PLATFORM_SITES_DOMAIN）後 /s/<slug> 會 301 到正式網址 → -L 跟隨，最後必須 200。
      - name: Post-deploy smoke
        run: |
          sleep 10
          for p in / /s/demo-coffee-local /.well-known/oauth-protected-resource; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "https://gather-builder.vercel.app$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
          # MCP OAuth：PRM 要是正確 JSON（resource＝MCP 端點、authorization_servers 有平台）
          curl -s "https://gather-builder.vercel.app/.well-known/oauth-protected-resource" | grep -q '"resource":"https://gather-builder.vercel.app/api/mcp"' || exit 1
